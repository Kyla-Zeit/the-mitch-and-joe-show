<section id="events" class="events-section">
  <div class="container">
    <div class="section-header">
      <p class="section-subtitle">Catch Us Live</p>
      <h2 class="section-title">Upcoming Events</h2>
      <p class="section-description">
        Check out where we are playing next. Come see us live and experience the energy of classic rock!
      </p>
    </div>

    <div class="events-grid">
      <div *ngFor="let event of events" class="event-card">
        <div class="event-date">
          <p class="date-text">{{ event.date }}</p>
        </div>
        <div class="event-details">
          <h3 class="event-title">{{ event.title }}</h3>
          <p class="event-venue">{{ event.venue }}</p>
          <p class="event-location">{{ event.location }} • {{ event.time }}</p>
        </div>
      </div>
    </div>

    <div class="cta-section">
      <p class="cta-text">Want us at your next event?</p>
      <a href="#contact" class="btn-cta" (click)="scrollToContact($event)">Request a Booking</a>
    </div>
  </div>
</section>
