<section id="services" class="services-section">
  <div class="container">
    <!-- Section Header -->
    <div class="section-header">
      <p class="section-subtitle">What We Offer</p>
      <h2 class="section-title">Our Services</h2>
      <p class="section-description">
        From intimate acoustic sets to full band performances, we bring the energy and nostalgia of classic rock to any event.
      </p>
    </div>

    <!-- Services Grid -->
    <div class="services-grid">
      <div *ngFor="let service of services; let i = index" class="service-card">
        <div class="service-icon">
          <svg *ngIf="i === 0" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <svg *ngIf="i === 1" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5.8 11.3 2 22l10.7-3.79"></path>
            <path d="M4 3h.01"></path>
            <path d="M22 8h.01"></path>
            <path d="M15 2h.01"></path>
            <path d="M22 20h.01"></path>
            <path d="m22 2-2.24.75a2.9 2.9 0 0 0-1.96 3.12c.1.86-.57 1.63-1.45 1.63h-.38c-.86 0-1.6.6-1.76 1.44L14 10"></path>
            <path d="m22 13-.82-.33c-.86-.34-1.82.2-1.98 1.11-.16.91-.92 1.6-1.85 1.6h-.38c-.86 0-1.6.6-1.76 1.44L15 17"></path>
            <path d="m11 2 .33.82c.34.86-.2 1.82-1.11 1.98C9.31 4.96 8.62 5.72 8.62 6.65v.38c0 .86-.6 1.6-1.44 1.76L6 9"></path>
            <path d="m11 13 .33.82c.34.86-.2 1.82-1.11 1.98-.91.16-1.6.92-1.6 1.85v.38c0 .86-.6 1.6-1.44 1.76L6 20"></path>
          </svg>
          <svg *ngIf="i === 2" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path>
          </svg>
          <svg *ngIf="i === 3" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
        </div>
        <h3 class="service-title">{{ service.title }}</h3>
        <p class="service-description">{{ service.description }}</p>
        <ul class="service-features">
          <li *ngFor="let feature of service.features" class="feature-item">
            <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            {{ feature }}
          </li>
        </ul>
      </div>
    </div>
  </div>
</section>
