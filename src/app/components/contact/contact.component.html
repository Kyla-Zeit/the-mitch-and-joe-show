<section id="contact" class="contact-section">
  <div class="container">
    <div class="section-header">
      <p class="section-subtitle">Get in Touch</p>
      <h2 class="section-title">Book Us For Your Event</h2>
      <p class="section-description">
        Ready to bring classic rock to your next event? Fill out the form below and we'll get back to you soon.
      </p>
    </div>

    <div class="contact-wrapper">
      <div class="contact-info">
        <h3 class="info-title">Contact Information</h3>
        <div class="contact-person">
          <h4>Mitch Haq</h4>
          <p><a href="tel:6478507707">647-850-7707</a></p>
          <p><a href="mailto:mitchhaq&#64;hotmail.com">mitchhaq&#64;hotmail.com</a></p>
        </div>
        <div class="contact-person">
          <h4>Joe Pickford</h4>
          <p><a href="tel:2892427510">289-242-7510</a></p>
          <p><a href="mailto:pickford66&#64;gmail.com">pickford66&#64;gmail.com</a></p>
        </div>
      </div>

      <form class="contact-form" (ngSubmit)="onSubmit()" #contactForm="ngForm">
        <div class="form-group">
          <input type="text" name="name" [(ngModel)]="formData.name" placeholder="Your Name" required>
        </div>
        <div class="form-group">
          <input type="email" name="email" [(ngModel)]="formData.email" placeholder="Email" required>
        </div>
        <div class="form-group">
          <input type="tel" name="phone" [(ngModel)]="formData.phone" placeholder="Phone">
        </div>
        <div class="form-group">
          <input type="date" name="eventDate" [(ngModel)]="formData.eventDate" placeholder="Event Date">
        </div>
        <div class="form-group">
          <input type="text" name="eventType" [(ngModel)]="formData.eventType" placeholder="Event Type">
        </div>
        <div class="form-group">
          <textarea name="message" [(ngModel)]="formData.message" placeholder="Message" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn-submit" [disabled]="!contactForm.valid">Send Message</button>
      </form>
    </div>
  </div>
</section>
