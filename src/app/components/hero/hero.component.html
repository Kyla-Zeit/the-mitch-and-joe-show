<section id="home" class="hero">
  <!-- Background with overlay -->
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>

  <!-- Decorative elements -->
  <div class="decoration decoration-1"></div>
  <div class="decoration decoration-2"></div>

  <div class="hero-content">
    <div class="content-wrapper">
      <p class="subtitle">Classic Rock Entertainment</p>
      
      <h1 class="title">The Mitch & Joe Show</h1>
      
      <p class="description">
        A dynamic duo act featuring piano and 12-string guitar, performing timeless classic rock favorites for clubs, parties, and special events.
      </p>

      <div class="buttons">
        <a href="#contact" class="btn btn-primary" (click)="scrollToSection('#contact', $event)">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          Book Us Now
        </a>
        <a href="#about" class="btn btn-secondary" (click)="scrollToSection('#about', $event)">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          Learn More
        </a>
      </div>

      <!-- Stats -->
      <div class="stats">
        <div class="stat">
          <p class="stat-number">20+</p>
          <p class="stat-label">Years Experience</p>
        </div>
        <div class="stat">
          <p class="stat-number">500+</p>
          <p class="stat-label">Shows Performed</p>
        </div>
        <div class="stat">
          <p class="stat-number">100%</p>
          <p class="stat-label">Satisfaction</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Scroll indicator -->
  <div class="scroll-indicator">
    <div class="mouse">
      <div class="mouse-wheel"></div>
    </div>
  </div>
</section>
