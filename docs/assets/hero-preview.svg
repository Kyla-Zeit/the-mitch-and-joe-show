      <rect width="176" height="54" rx="8" fill="#E8C757"/>
      <text x="88" y="34" text-anchor="middle" fill="#18191E" font-family="Arial, sans-serif" font-size="15" font-weight="800">BOOK US NOW</text>
      <rect x="192" width="166" height="54" rx="8" fill="#171820" stroke="#F5F5F4" stroke-width="2"/>
      <text x="275" y="34" text-anchor="middle" fill="#F5F5F4" font-family="Arial, sans-serif" font-size="15" font-weight="800">LEARN MORE</text>
    </g>
    <g transform="translate(0 444)">
      <g><text x="0" y="0" fill="#E8C757" font-family="Arial Black, Arial, sans-serif" font-size="34">20+</text><text x="0" y="28" fill="#858791" font-family="Arial, sans-serif" font-size="13">Years Experience</text></g>
      <g transform="translate(170 0)"><text x="0" y="0" fill="#E8C757" font-family="Arial Black, Arial, sans-serif" font-size="34">500+</text><text x="0" y="28" fill="#858791" font-family="Arial, sans-serif" font-size="13">Shows Performed</text></g>
      <g transform="translate(350 0)"><text x="0" y="0" fill="#E8C757" font-family="Arial Black, Arial, sans-serif" font-size="34">100%</text><text x="0" y="28" fill="#858791" font-family="Arial, sans-serif" font-size="13">Satisfaction</text></g>
    </g>
  </g>
