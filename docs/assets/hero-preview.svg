<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">The Mitch &amp; Joe Show hero preview</title>
  <desc id="desc">Dark classic rock entertainment landing page with gold accents, booking calls to action, and performance statistics.</desc>
  <defs>
    <radialGradient id="goldGlow" cx="0" cy="0" r="1" gradientTransform="translate(245 185) rotate(35) scale(430 310)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8C757" stop-opacity=".20"/>
      <stop offset="1" stop-color="#E8C757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rustGlow" cx="0" cy="0" r="1" gradientTransform="translate(1000 620) rotate(200) scale(420 320)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C75A3B" stop-opacity=".18"/>
      <stop offset="1" stop-color="#C75A3B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101116"/>
      <stop offset=".55" stop-color="#171820"/>
      <stop offset="1" stop-color="#111217"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".38"/></filter>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#stage)"/>
  <rect width="1200" height="760" rx="28" fill="url(#goldGlow)"/>
  <rect width="1200" height="760" rx="28" fill="url(#rustGlow)"/>
  <g opacity=".18" stroke="#E8C757" stroke-width="2">
    <circle cx="1040" cy="155" r="82"/>
    <circle cx="1040" cy="155" r="116"/>
    <path d="M955 154h170M1040 68v173"/>
  </g>
  <g transform="translate(112 108)">
