    <text x="0" y="118" fill="#F5F5F4" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="1">THE MITCH &amp;</text>
    <text x="0" y="194" fill="#E8C757" font-family="Arial Black, Arial, sans-serif" font-size="86" font-weight="900" letter-spacing="1">JOE SHOW</text>
    <text x="2" y="246" fill="#A9AAB2" font-family="Arial, sans-serif" font-size="21">Piano, 12-string guitar, vocals and classic rock favourites</text>
    <text x="2" y="278" fill="#A9AAB2" font-family="Arial, sans-serif" font-size="21">for clubs, private parties and special events.</text>
